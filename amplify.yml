version: 2
applications:
  - appRoot: .
    backend:
      phases:
        build:
          commands:
            - echo "Skipping backend deployment"
            # If you want ZERO backend work, you can leave this empty or just echo
            # (do NOT run `npm ci` or `npx ampx pipeline-deploy` here)
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            # Use npm install instead of npm ci to avoid lockfile sync errors
            - npm install
            - npx ng version
        build:
          commands:
            - npx ng build --configuration=production
      artifacts:
        baseDirectory: dist/amplify-angular-template/browser
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
