#increment version by 1 with every new deployment
version: 2
backend:
  phases:
    build:
      commands:
        - echo "Skipping backend deployment for now"
frontend:
  phases:
    preBuild:
      commands:
        # Clear Amplify cache
        - rm -rf .amplify

        # Clear lockfile so npm install is free to resolve deps
        - rm -f package-lock.json

        # Install dependencies
        - npm install
        
        - npx ng version
    build:
      commands:
        # Use the lighter dev configuration to reduce memory usage
        - npx ng build --configuration=development
  artifacts:
    # Angular 19 puts browser output under dist/<name>/browser
    baseDirectory: dist/amplify-angular-template/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
