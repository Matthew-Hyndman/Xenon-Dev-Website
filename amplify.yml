version: 2
backend:
  phases:
    build:
      commands:
        - npm install --cache .npm --prefer-offline
        - npm install @parcel/watcher --save-optional
        - echo "deploying backend"
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npx ng version
    build:
      commands:
        # the build commands
        - npm run build:$AWS_BRANCH
    postBuild:
      commands:
        - echo "Build complete"
        - du -sh dist/amplify-angular-template/browser

  artifacts:
    # Angular 19 puts browser output under dist/<name>/browser
    baseDirectory: dist/amplify-angular-template/browser
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
