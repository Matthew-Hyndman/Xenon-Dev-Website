version: 2
applications:
  - appRoot: .
    backend:
      phases:
        build:
          commands:
            - npm install
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
            - npx ng version
        build:
          commands:
            - npx ng build --configuration=production
      artifacts:
        baseDirectory: dist/amplify-angular-template/browser
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
