#increment version by 1 with every new deployment
version: 2
backend:
  phases:
    build:
      commands:
        - echo "deploying backend sandbox environment"
        - npx @aws-amplify/backend-cli sandbox
frontend:
  phases:
    preBuild:
      commands:
        # Clear Amplify cache
        #- rm -rf .amplify

        # Install dependencies with legacy peer deps support
        - npm install #--legacy-peer-deps

        # Runtime config file for the selected build environment


        - npx ng version
    build:
      commands:
        # the dev build commands
        - npm run build
    postBuild:
      commands:
        - echo "Build complete"

  artifacts:
    # Angular 19 puts browser output under dist/<name>/browser
    baseDirectory: dist/amplify-angular-template/browser
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
