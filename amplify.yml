#increment version by 1 with every new deployment
version: 2
backend:
  phases:
    build:
      commands:
        - echo "Skipping backend deployment for now"
frontend:
  phases:
    preBuild:
      commands:
        # Clear Amplify cache
        - rm -rf .amplify

        # Install dependencies with legacy peer deps support
        - npm install --legacy-peer-deps
        
        - npx ng version
    build:
      commands:
        # Use the lighter dev configuration to reduce memory usage
        - export NODE_OPTIONS=--max_old_space_size=6144
        - export NG_BUILD_MAX_WORKERS=2
        - npx ng build --configuration=production --source-map=false
        # - npx ng build --configuration=development --source-map=false
  artifacts:
    # Angular 19 puts browser output under dist/<name>/browser
    baseDirectory: dist/amplify-angular-template/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*