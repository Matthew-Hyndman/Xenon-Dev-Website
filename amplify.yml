#increment version by 1 with every new deployment
version: 2
backend:
  phases:       
  build:
    commands:
      - npm ci --cache .npm --prefer-offline
      - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # Optional: clear previous installs if you suspect cache issues
            # - rm -rf node_modules
            # - rm package-lock.json

            # Install dependencies
            - npm ci

            # Sanity check Angular + TS versions
            - npx ng version
    build:
      commands:
        - npx ng build --configuration=production
  artifacts:
    baseDirectory: dist/amplify-angular-template/browser
    files:
      - '**/*'
  cache:
    paths:
      #- .npm/**/*
      - node_modules/**/*
