version: 2
applications:
  - appRoot: .
    backend:
      phases:
        build:
          commands:
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            # Install from lockfile (this will install TypeScript 5.8.3 from devDependencies)
            - npm ci

            # Optional sanity check
            - npx ng version
        build:
          commands:
            - npx ng build --configuration=production
      artifacts:
        baseDirectory: dist/amplify-angular-template/browser
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
