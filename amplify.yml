version: 2
applications:
  - appRoot: .
    env:
      variables:
        NODE_VERSION: "20"
        PARCEL_WATCHER_DISABLE: "1"
    backend:
      phases:
        preBuild:
          commands:
            - nvm install $NODE_VERSION || . ~/.nvm/nvm.sh && nvm install $NODE_VERSION
            - nvm use $NODE_VERSION || . ~/.nvm/nvm.sh && nvm use $NODE_VERSION
            - node -v
        build:
          commands:
            - npm ci --cache .npm --prefer-offline
            # Disable native watcher so ampx doesn't require @parcel/watcher prebuild
            - export PARCEL_WATCHER_DISABLE=1
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use $NODE_VERSION || . ~/.nvm/nvm.sh && nvm use $NODE_VERSION
            - node -v
            - npm ci
            - npx ng version
        build:
          commands:
            - npx ng build --configuration=production
      artifacts:
        baseDirectory: dist/amplify-angular-template/browser
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
