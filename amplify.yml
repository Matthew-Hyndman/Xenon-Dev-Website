version: 2
applications:
  - appRoot: .
    backend:
      phases:
        build:
          commands:
            - node -v
            - npm ci --cache .npm --prefer-offline
            #- npm install --no-save @parcel/watcher-linux-x64-glibc
            #- npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - npm install
            - npx ng version
        build:
          commands:
            - npx ng build --configuration=production
      artifacts:
        baseDirectory: dist/amplify-angular-template/browser
        files:
          - '**/*'
      cache:
        paths:
          #- .npm/**/*
          #- node_modules/**/*
