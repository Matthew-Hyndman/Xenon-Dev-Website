<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fulid">
      <h1>Leaderboard</h1>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Wins</th>
            <th>Losses</th>
            <th>Pot</th>
          </tr>
        </thead>
        <tbody>
          @for (playerRec of this.leaderboardData; track $index) {
            <tr>
              <td>{{ playerRec.username }}</td>
              <td>{{ playerRec.wins }}</td>
              <td>{{ playerRec.losses }}</td>
              <td>{{ playerRec.pot }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer-pagination">
  <div class="row">
    <div class="col-md-6"></div>
    <div class="col-md-6">
      <div class="row">
        <div class="col-md-9" style="padding-left: 30%">
          <ngb-pagination
            [(page)]="pageNo"
            [pageSize]="pageSize"
            [collectionSize]="leaderboardData.length"
            [maxSize]="5"
            [boundaryLinks]="true"
            
          >
          </ngb-pagination>
        </div>
        <div class="col-md-3 mt-2" style="text-align: right">
          <span class="mr-2">Page Size</span>
          <select name="pageSizeSelection" id="pageSizeSelection">
            @for (sizeOption of pageSizeRange; track $index) {}
            <option value="{{ pageSizeRange }}">{{ pageSizeRange }}</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
