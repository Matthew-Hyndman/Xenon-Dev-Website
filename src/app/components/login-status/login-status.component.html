<div class="login-status-header">
  @if (IsAuthenticated && userFullName) {
  <div class="login-status-user-info">Welcome {{ userFullName }}</div>
  }
  
  @if (IsAuthenticated) {
  <button *ngIf="IsAuthenticated" (click)="logout()" class="security-btn">Logout</button>

  <button *ngIf="IsAuthenticated" routerLink="/profile" class="security-btn ml-1">profile</button>

  <!--<button *ngIf="IsAuthenticated" routerLink="/order-history" class="security-btn ml-1">Orders</button>-->

  } @else {

  <button routerLink="/login" class="security-btn">Login</button>
  
  }
</div>
